# @package target
# 8YWA target configuration

target_name: "8ywa"
target_pdb_path: "pdbs/8YWA.pdb"

# Ensure chains in PDB have the right chain IDs (ideally A, B, C, etc.)
target_chain: "A"
binder_chain: "B"

# User-selected epitope residues on chain A:
# HIS66, GLU72, ASN79, LYS84
target_hotspots: "A66,A72,A79,A84"

# Residue to be used for Chai-1 distance constraint ({residue 1-letter}{res. num.}).
# Can delete or set to None if no constraint. Residue should be in chain A.
hotspot_residue: "K84"
